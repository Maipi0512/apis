spring.application.name=ecom
server.port=4002

# Credenciales (usuario/password de Supabase, secret del JWT) NO van en
# este archivo porque se sube a git. Estan en application-local.properties,
# que esta en .gitignore. Ver application-local.properties.example para
# saber que claves poner ahi. Si este archivo no existe, la app no
# arranca (el import es obligatorio a proposito, para que no se te olvide
# crearlo).
spring.config.import=classpath:application-local.properties

# --- Conexion a Supabase (Postgres, conexion directa) ---
# Nota: la conexion directa (db.xxx.supabase.co) es IPv6-only, asi que si
# estas en una red sin salida IPv6 (ej. la de la facu) esto puede fallar y
# hay que volver a usar el pooler (aws-0-sa-east-1.pooler.supabase.com,
# usuario postgres.<project-ref>). Para conexion directa el usuario en
# application-local.properties tiene que ser "postgres" a secas.
spring.datasource.url=jdbc:postgresql://db.iqtciknccdkhtoytmrpd.supabase.co:5432/postgres?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update: Hibernate va actualizando el esquema a medida que cambian las
# entidades, sin borrar los datos que ya tenes guardados.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- JWT ---
# Clave para firmar los tokens (HMAC-SHA), definida en application-local.properties.
application.security.jwt.secret-key=${JWT_SECRET_KEY}
# 86400000 ms = 24hs
application.security.jwt.expiration=86400000

# --- Subida de imagenes (multipart) ---
# Por default Spring solo permite hasta 1MB por archivo/request; lo
# subimos para poder subir fotos de productos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Admin inicial ---
# El registro publico (/auth/registro) siempre crea CLIENTE, nunca
# ADMIN. AdminSeeder crea este usuario al arrancar la app, solo si
# todavia no existe ningun ADMIN. Se puede pisar el email/password por
# defecto con ADMIN_EMAIL/ADMIN_PASSWORD en application-local.properties.
application.admin.email=${ADMIN_EMAIL:admin@ecom.com}
application.admin.password=${ADMIN_PASSWORD:admin1234}

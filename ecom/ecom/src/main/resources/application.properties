spring.application.name=ecom
server.port=4002

# --- Conexion a Supabase (Postgres, via Session Pooler) ---
# Se uso el pooler (en vez de la conexion directa db.xxx.supabase.co) porque
# esa conexion directa es IPv6-only y la red de la facu no tiene salida IPv6.
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres.iqtciknccdkhtoytmrpd
spring.datasource.password=tomijoacoyo

# update: Hibernate va actualizando el esquema a medida que cambian las
# entidades, sin borrar los datos que ya tenes guardados.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
